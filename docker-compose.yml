services:
  db:
    image: postgres:18.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5435:5432"
    env_file: .docker_env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: python manage.py runserver_plus 0.0.0.0:8000 --nopin
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file: .docker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    stdin_open: true
  worker:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: celery -A lolsite worker -l info
    volumes:
      - .:/code
    env_file: .docker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  beat:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: celery -A lolsite beat -l INFO
    volumes:
      - .:/code
    env_file: .docker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  redis:
    image: redis
  tailwind:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: tailwindcss -i ./lolsite/static/src/main.css -o ./lolsite/static/src/output.css --minify --watch
    volumes:
      - .:/code
    env_file: .docker_env
    stdin_open: true

volumes:
  postgres_data:
