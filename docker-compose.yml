services:
  db:
    image: postgres:18.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5435:5432"
    env_file: .docker_env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
  frontend:
    image: node:24-alpine
    working_dir: /app
    # ponytail: install on startup; build an image if startup time matters.
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: python manage.py runserver_plus 0.0.0.0:8000 --nopin
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file: .docker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    stdin_open: true
  worker:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: celery -A lolsite worker -l info
    volumes:
      - .:/code
    env_file: .docker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  beat:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    command: celery -A lolsite beat -l INFO
    volumes:
      - .:/code
    env_file: .docker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  redis:
    image: redis

volumes:
  postgres_data:
  frontend_node_modules:
